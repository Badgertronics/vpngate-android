name: Build and Publish Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare and rename Release APKs
        run: |
          mkdir -p release_assets
          TAG="${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag_name || 'v1.0.0') }}"
          
          cp app/build/outputs/apk/release/app-universal-release.apk "release_assets/vpngate-android-${TAG}-universal.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release_assets/vpngate-android-${TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release_assets/vpngate-android-${TAG}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "release_assets/vpngate-android-${TAG}-x86_64.apk"
          cp app/build/outputs/apk/release/app-x86-release.apk "release_assets/vpngate-android-${TAG}-x86.apk"
          
          cd release_assets
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpngate-android-apks
          path: release_assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          name: vpngate-android-apks
          path: release_assets

      - name: Display downloaded artifacts
        run: ls -lh release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag_name || 'v1.0.0') }}
          name: "VPN Gate Android ${{ github.ref_type == 'tag' && github.ref_name || (inputs.tag_name || 'v1.0.0') }}"
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
